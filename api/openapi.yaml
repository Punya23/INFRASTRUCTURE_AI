openapi: 3.1.0
info:
  title: INFRA-AI investor API
  version: 0.1.0
  summary: Explainable infrastructure scores for the cities and areas of India.
  description: |
    Read-only JSON API behind the "where should I invest?" flow. A score is a config-weighted sum of observed
    infrastructure facts with stored drivers (ADR-0003). *Scores describe existing infrastructure and past
    growth. They are not forecasts, price predictions or financial advice.*

    **Data.** Loaded once at start-up from the fixtures the pipeline exports to `web/fixtures/invest/`
    (design spec section 6); the Go store holds no scoring logic. Every example in this file comes from the
    synthetic test world in `api/testdata/invest/` (each record has `source: synthetic-test`), so the numbers
    are invented and must never be shown as real.

    **Errors.** Always `{"error": {"code", "message"}}`. The message is safe to show and never carries
    internal detail. Codes: `bad_request` 400, `not_found` 404, `rate_limited` 429 (with `Retry-After`) and
    `internal` 500; a request that outlives its 5 s budget is answered 503 with code `internal`.

    **Validation.** State codes match `^[A-Z]{2}$` and city ids `^[a-z0-9-]{2,64}$`; both are looked up in
    memory and never used to build a path. An unknown `preset`, an unknown enum value or an out-of-range
    `limit` is a 400 - a limit is never clamped silently.

    **Empty and unknown.** A list is never `null`: an empty list is `[]`. A `null` inside a record means "not
    observed" and is never a zero; show "-", not 0.

    **Operations.** Per-IP fixed-window rate limit (default 120 requests a minute), CORS allow-list from the
    environment (default `http://localhost:8765`), `X-Content-Type-Options: nosniff` on every response and
    `Cache-Control: public, max-age=300` on the data routes.
servers:
  - url: http://localhost:8080
    description: Local development (`-addr :8080`)
tags:
  - name: meta
    description: Service state and the scoring model.
  - name: states
    description: States and their top cities.
  - name: cities
    description: City search, city detail, areas, map layers and comparison.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Liveness and data date
      responses:
        "200":
          description: The service is up and its data is loaded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
              examples:
                ok:
                  value:
                    {status: ok, as_of: '2026-09-29'}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: The scoring model, sources and disclaimer
      description: The content of `meta.json`. The UI reads preset ids, factor bands, sources and the disclaimer from here.
      responses:
        "200":
          description: The scoring model the fixtures were built with.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Meta"}
              examples:
                meta:
                  value:
                    schema_version: 1
                    as_of: '2026-09-29'
                    grid: {h3_res: 7, buffer_rings: 3, min_area_population: 1000, best_area_min_population: 5000}
                    factors:
                      - id: nh_access
                        group: access
                        unit: km
                        better: lower
                        headline_band_km: 10
                        bands:
                          - [0, 100]
                          - [2, 90]
                          - [5, 70]
                          - [10, 40]
                          - [25, 0]
                      - id: rail_access
                        group: access
                        unit: km
                        better: lower
                        headline_band_km: 2
                        bands:
                          - [0, 100]
                          - [1, 90]
                          - [3, 65]
                          - [8, 25]
                          - [15, 0]
                      - id: metro_access
                        group: access
                        unit: km
                        better: lower
                        headline_band_km: 2
                        bands:
                          - [0, 100]
                          - [1, 90]
                          - [2, 70]
                          - [5, 30]
                          - [10, 0]
                      - id: road_strength
                        group: access
                        unit: km_per_km2
                        better: higher
                        headline_band_km: null
                        bands:
                          - [0, 0]
                          - [0.3, 30]
                          - [1, 65]
                          - [2, 90]
                          - [3, 100]
                      - id: built_up_growth
                        group: momentum
                        unit: pp
                        better: higher
                        headline_band_km: null
                        bands:
                          - [0, 0]
                          - [3, 30]
                          - [10, 60]
                          - [25, 90]
                          - [40, 100]
                    presets:
                      - id: balanced
                        weights: {nh_access: 0.25, rail_access: 0.15, metro_access: 0.15, road_strength: 0.15, built_up_growth: 0.3}
                        default: true
                      - id: commuter
                        weights: {nh_access: 0.1, rail_access: 0.25, metro_access: 0.3, road_strength: 0.1, built_up_growth: 0.25}
                        default: false
                      - id: highway
                        weights: {nh_access: 0.45, rail_access: 0.05, metro_access: 0.0, road_strength: 0.2, built_up_growth: 0.3}
                        default: false
                      - id: growth
                        weights: {nh_access: 0.15, rail_access: 0.1, metro_access: 0.1, road_strength: 0.1, built_up_growth: 0.55}
                        default: false
                    tiers: {metro_min_population: 2500000, large_min_population: 1000000}
                    sources:
                      - {id: synthetic-test, name: 'Synthetic test data (invented, not real)', license: synthetic-test, attribution: Invented
                          for tests in api/testdata/invest; never shipped or served in production.}
                    disclaimer: Scores describe existing infrastructure and past growth. They are not forecasts, price predictions or financial
                      advice.
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/states:
    get:
      operationId: listStates
      tags: [states]
      summary: Every state and union territory with its city count
      description: All 36 states and union territories are listed; `city_count` may be 0 (Goa in the synthetic world).
      responses:
        "200":
          description: States in `states.json` order.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatesResponse"}
              examples:
                states:
                  value:
                    as_of: '2026-09-29'
                    states:
                      - {code: DL, name: Delhi, city_count: 1}
                      - {code: GA, name: Goa, city_count: 0}
                      - {code: KA, name: Karnataka, city_count: 1}
                      - {code: MH, name: Maharashtra, city_count: 3}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/states/{code}/cities:
    get:
      operationId: listStateCities
      tags: [states]
      summary: The top cities of a state, ranked for a preset
      description: |
        Cities of one state ordered by score for the preset (ties: larger population, then id). A state with
        fewer cities than `limit`, or none, is a normal 200 with a short or empty `cities` list; `total` says
        how many cities the state has. Only an unknown code is a 404.
      parameters:
        - $ref: "#/components/parameters/StateCode"
        - $ref: "#/components/parameters/Preset"
        - name: limit
          in: query
          description: Maximum number of cities in the response. Outside 1-20 is a 400.
          schema: {type: integer, minimum: 1, maximum: 20, default: 5}
      responses:
        "200":
          description: The ranked cities.
