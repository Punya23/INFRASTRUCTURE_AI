components:
  parameters:
    StateCode:
      name: code
      in: path
      required: true
      description: State or union-territory code (ISO 3166-2:IN), upper case. Malformed is a 400, unknown a 404.
      schema: {type: string, pattern: "^[A-Z]{2}$"}
      example: MH
    CityId:
      name: id
      in: path
      required: true
      description: City id, a slug. Malformed is a 400, unknown a 404.
      schema: {type: string, pattern: "^[a-z0-9-]{2,64}$"}
      example: pune
    Preset:
      name: preset
      in: query
      description: |
        Scoring preset; one of `presets[].id` in `/v1/meta`. Omitted means the preset marked `default`
        (`balanced`). Anything else is a 400.
      schema:
        $ref: "#/components/schemas/PresetId"
        default: balanced

  headers:
    CacheControl:
      description: Data routes may be cached for five minutes.
      schema: {type: string, const: "public, max-age=300"}
    RetryAfter:
      description: Seconds until the rate-limit window resets.
      schema: {type: integer, minimum: 0}

  responses:
    BadRequest:
      description: A path value, query value or limit is malformed or out of range.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            limit:
              value: {error: {code: bad_request, message: "limit must be an integer from 1 to 20"}}
    NotFound:
      description: The state code or city id is well formed but not in the data.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            city:
              value: {error: {code: not_found, message: "city not found"}}
    RateLimited:
      description: This client exceeded the per-minute request limit.
      headers:
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            limited:
              value: {error: {code: rate_limited, message: "too many requests; retry later"}}
    Internal:
      description: An unexpected failure, or a request that outlived its time budget (503). Nothing internal is disclosed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            failure:
              value: {error: {code: internal, message: "internal error"}}

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: {type: string, enum: [bad_request, not_found, rate_limited, internal]}
            message: {type: string, description: Human-readable and safe to show.}

    Health:
      type: object
      required: [status, as_of]
      additionalProperties: false
      properties:
        status: {type: string, const: ok}
        as_of: {type: string, format: date, description: Date the fixtures were built.}

    # ---- vocabularies -------------------------------------------------------------------------------
    FactorId:
      type: string
      enum: [nh_access, rail_access, metro_access, road_strength, built_up_growth]
      description: |
        nh_access - distance to the nearest national highway or expressway; rail_access - distance to a rail
        station; metro_access - distance to a metro, monorail or light-rail station; road_strength - trunk,
        primary and secondary road length per km2 (network capacity, not pavement condition);
        built_up_growth - change in built-up share 2000 to 2020.
    PresetId:
      type: string
      enum: [balanced, commuter, highway, growth]
    Tier:
      type: string
      enum: [metro, large, mid]
    Unit:
      type: string
      enum: [km, km_per_km2, pp]
      description: Kilometres, kilometres of road per km2, percentage points of built-up share.

    # ---- meta ---------------------------------------------------------------------------------------
    Meta:
      type: object
      required: [schema_version, as_of, grid, factors, presets, tiers, sources, disclaimer]
      additionalProperties: false
      properties:
        schema_version: {type: integer, const: 1}
        as_of: {type: string, format: date}
        grid:
          type: object
          required: [h3_res, buffer_rings, min_area_population, best_area_min_population]
          additionalProperties: false
          properties:
            h3_res: {type: integer, description: "H3 resolution of an area; 7 is about 5.2 km2."}
            buffer_rings: {type: integer, description: Rings of cells kept around the urban centre.}
            min_area_population: {type: integer, description: A cell below this population is not an area.}
            best_area_min_population: {type: integer, description: Population from which an area is eligible to be a best area.}
        factors: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Factor"}}
        presets: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Preset"}}
        tiers:
          type: object
          required: [metro_min_population, large_min_population]
          additionalProperties: false
          properties:
            metro_min_population: {type: integer}
            large_min_population: {type: integer}
        sources: {type: array, items: {$ref: "#/components/schemas/Source"}}
        disclaimer: {type: string, description: Shown on every result page.}
    Factor:
      type: object
      required: [id, group, unit, better, headline_band_km, bands]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/FactorId"}
        group: {type: string, enum: [access, momentum]}
        unit: {$ref: "#/components/schemas/Unit"}
        better: {type: string, enum: [lower, higher]}
        headline_band_km:
          type: [number, "null"]
          description: Distance inside which a resident counts as served; null for roads and growth.
        bands:
          type: array
          description: Knots of the piecewise-linear map from the raw value to a 0-100 sub-score.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: number}
    Preset:
      type: object
      required: [id, weights, default]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/PresetId"}
        weights:
          type: object
          description: One weight per factor; the weights of a preset sum to 1.
          required: [nh_access, rail_access, metro_access, road_strength, built_up_growth]
          additionalProperties: false
          properties:
            nh_access: {type: number, minimum: 0, maximum: 1}
            rail_access: {type: number, minimum: 0, maximum: 1}
            metro_access: {type: number, minimum: 0, maximum: 1}
            road_strength: {type: number, minimum: 0, maximum: 1}
            built_up_growth: {type: number, minimum: 0, maximum: 1}
        default: {type: boolean, description: Exactly one preset is the default.}
    Source:
      type: object
      required: [id, name, license, attribution]
      additionalProperties: false
      properties:
        id: {type: string}
        name: {type: string}
        license: {type: string}
        attribution: {type: string}

    # ---- states and cities ----------------------------------------------------------------------------
    State:
      type: object
      required: [code, name, city_count]
      additionalProperties: false
      properties:
        code: {type: string, pattern: "^[A-Z]{2}$"}
        name: {type: string}
        city_count: {type: integer, minimum: 0, description: "Cities of at least 100,000 people in the state; may be 0."}
    StatesResponse:
      type: object
      required: [as_of, states]
      additionalProperties: false
      properties:
        as_of: {type: string, format: date}
        states: {type: array, items: {$ref: "#/components/schemas/State"}}

    Driver:
      type: object
      description: A factor that lifts a score. For a city, `points` is the population-weighted mean of its areas' points.
      required: [factor, points, value, unit, share, band_km]
      additionalProperties: false
      properties:
        factor: {$ref: "#/components/schemas/FactorId"}
        points: {type: number, description: "Contribution to the score, in score points."}
        value: {type: [number, "null"], description: Raw value (a population-weighted median for a city).}
        unit: {$ref: "#/components/schemas/Unit"}
        share: {type: [number, "null"], minimum: 0, maximum: 1, description: Share of residents inside `band_km`; null for roads and growth.}
        band_km: {type: [number, "null"], description: The factor's headline distance band.}
    Gap:
      type: object
      description: A watch-out - a factor with a low sub-score, worst weighted shortfall first.
      required: [factor, subscore, value, unit, share, band_km]
      additionalProperties: false
      properties:
        factor: {$ref: "#/components/schemas/FactorId"}
        subscore: {type: number, minimum: 0, maximum: 100}
        value: {type: [number, "null"]}
        unit: {$ref: "#/components/schemas/Unit"}
        share: {type: [number, "null"], minimum: 0, maximum: 1}
        band_km: {type: [number, "null"]}
    BestArea:
      type: object
      description: The highest-scoring eligible area of the city.
      required: [id, name, score]
      additionalProperties: false
      properties:
        id: {type: string, description: H3 cell id.}
        name: {type: [string, "null"], description: "Null when OpenStreetMap names no place near the cell; the UI shows 'Area near ...'."}
        score: {type: number, minimum: 0, maximum: 100}
    FactorSummary:
      type: object
      required: [value, unit, share, band_km, subscore]
      additionalProperties: false
      properties:
        value: {type: [number, "null"], description: Population-weighted median raw value.}
        unit: {$ref: "#/components/schemas/Unit"}
        share: {type: [number, "null"], minimum: 0, maximum: 1, description: Share of residents inside the headline band.}
        band_km: {type: [number, "null"]}
        subscore: {type: [number, "null"], minimum: 0, maximum: 100, description: Population-weighted mean of the areas' sub-scores.}
    CityData:
      type: object
      required: [bus, metro_stations, rail_stations]
      additionalProperties: false
      properties:
        bus:
          description: The bus feed shown for the city; null when there is none (bus stops are never scored).
          oneOf:
            - type: "null"
            - type: object
              required: [operator, tier, stops]
              additionalProperties: false
              properties:
                operator: {type: string}
                tier: {type: string}
                stops: {type: integer, minimum: 0}
        metro_stations: {type: integer, minimum: 0}
        rail_stations: {type: integer, minimum: 0}

    CityBase:
      type: object
      description: What a city looks like for one preset - the ranked card without its rank.
      required: [id, name, state, tier, population, score, access, momentum, coverage, confidence, drivers, gaps, best_area, source, source_ref, fetched_at, license]
      properties:
        id: {type: string, pattern: "^[a-z0-9-]{2,64}$"}
        name: {type: string}
        state: {type: string, pattern: "^[A-Z]{2}$", description: ISO state code; shown next to the name because names repeat across states.}
        tier: {$ref: "#/components/schemas/Tier"}
        population: {type: integer, description: People in the urban centre inside the state (WorldPop 2020).}
        score: {type: number, minimum: 0, maximum: 100, description: Population-weighted mean of the city's area scores.}
        access: {type: [number, "null"], minimum: 0, maximum: 100, description: The same mean over the access factors only.}
        momentum: {type: [number, "null"], minimum: 0, maximum: 100, description: The built-up growth sub-score.}
        coverage: {type: number, minimum: 0, maximum: 1, description: Share of the preset's weight backed by observed data.}
        confidence: {type: number, minimum: 0, maximum: 1, description: 0.8 x coverage; 0.8 reflects community and modelled sources.}
        drivers: {type: array, maxItems: 3, items: {$ref: "#/components/schemas/Driver"}}
        gaps: {type: array, maxItems: 2, items: {$ref: "#/components/schemas/Gap"}}
        best_area: {$ref: "#/components/schemas/BestArea"}
        source: {type: string}
        source_ref: {type: string}
        fetched_at: {type: string, format: date}
        license: {type: string}
    CityCard:
      description: A city in a ranked list.
      allOf:
        - $ref: "#/components/schemas/CityBase"
        - type: object
          required: [rank]
          properties:
            rank: {type: integer, minimum: 1, description: "Position in the list it appears in (in a comparison, in the compared set including the base city)."}
      unevaluatedProperties: false
    City:
      description: One city with its factor summary and data flags.
      allOf:
        - $ref: "#/components/schemas/CityBase"
        - type: object
          required: [aliases, lat, lon, area_km2, cells, factors, data]
          properties:
            aliases: {type: array, items: {type: string}, description: Other big places inside the same urban centre.}
            lat: {type: number}
            lon: {type: number}
            area_km2: {type: number}
            cells: {type: integer, minimum: 1, description: Number of areas (H3 cells) of the city.}
            factors:
              type: object
              required: [nh_access, rail_access, metro_access, road_strength, built_up_growth]
              additionalProperties: false
              properties:
                nh_access: {$ref: "#/components/schemas/FactorSummary"}
                rail_access: {$ref: "#/components/schemas/FactorSummary"}
                metro_access: {$ref: "#/components/schemas/FactorSummary"}
                road_strength: {$ref: "#/components/schemas/FactorSummary"}
                built_up_growth: {$ref: "#/components/schemas/FactorSummary"}
            data: {$ref: "#/components/schemas/CityData"}
      unevaluatedProperties: false
    StateCitiesResponse:
      type: object
      required: [state, preset, total, cities]
      additionalProperties: false
      properties:
        state: {type: string, pattern: "^[A-Z]{2}$"}
        preset: {$ref: "#/components/schemas/PresetId"}
        total: {type: integer, minimum: 0, description: "Cities in the state, before `limit`."}
        cities: {type: array, items: {$ref: "#/components/schemas/CityCard"}}
    SearchHit:
      type: object
      required: [id, name, state, tier, population, matched]
      additionalProperties: false
      properties:
        id: {type: string}
        name: {type: string}
        state: {type: string, pattern: "^[A-Z]{2}$"}
        tier: {$ref: "#/components/schemas/Tier"}
        population: {type: integer}
        matched: {type: string, description: "The name or alias that matched, as stored."}
    SearchResponse:
      type: object
      required: [cities]
      additionalProperties: false
      properties:
        cities: {type: array, items: {$ref: "#/components/schemas/SearchHit"}}

    # ---- areas ----------------------------------------------------------------------------------------
    Position:
      type: array
      description: "[longitude, latitude], four decimals."
      minItems: 2
      maxItems: 2
      items: {type: number}
    PolygonGeometry:
      type: object
      required: [type, coordinates]
      additionalProperties: false
      properties:
        type: {type: string, const: Polygon}
        coordinates:
          type: array
          description: Rings of a hexagon, exterior ring first, counter-clockwise, closed.
          items:
            type: array
            minItems: 4
            items: {$ref: "#/components/schemas/Position"}
    AreaDriver:
      type: object
      required: [factor, points, value, unit]
      additionalProperties: false
      properties:
        factor: {$ref: "#/components/schemas/FactorId"}
        points: {type: number}
        value: {type: [number, "null"], description: "The cell's raw value, from `f`."}
        unit: {$ref: "#/components/schemas/Unit"}
    AreaGap:
      type: object
      required: [factor, subscore, value, unit]
      additionalProperties: false
      properties:
        factor: {$ref: "#/components/schemas/FactorId"}
        subscore: {type: number, minimum: 0, maximum: 100}
        value: {type: [number, "null"], description: "The cell's raw value, from `f`."}
        unit: {$ref: "#/components/schemas/Unit"}
    FactorValues:
      type: object
      description: One entry per factor; null means the factor was not observed for the cell (it is left out of the score, never scored as 0).
      required: [nh_access, rail_access, metro_access, road_strength, built_up_growth]
      additionalProperties: false
      properties:
        nh_access: {type: [number, "null"]}
        rail_access: {type: [number, "null"]}
        metro_access: {type: [number, "null"]}
        road_strength: {type: [number, "null"]}
        built_up_growth: {type: [number, "null"]}
    AreaProperties:
      type: object
      required: [id, name, pop, elig, bus_stops, rank, score, access, coverage, confidence, f, s, d, g, source, source_ref, fetched_at, license]
      additionalProperties: false
      properties:
        id: {type: string, description: H3 resolution-7 cell id.}
        name: {type: [string, "null"], description: "Null when no place is named near the cell; the UI shows 'Area near ...'."}
        pop: {type: number, minimum: 0, description: Residents in the cell (WorldPop 2020).}
        elig: {type: boolean, description: Eligible to be a best area; ineligible cells still draw on the map.}
        bus_stops: {type: [number, "null"], minimum: 0, description: "Bus stops in the cell; null where the city has no feed, 0 where it has one and the cell has no stop."}
        rank: {type: integer, minimum: 1, description: Position among all cells of the city for the requested preset.}
        score: {type: number, minimum: 0, maximum: 100, description: For the requested preset.}
        access: {type: [number, "null"], minimum: 0, maximum: 100, description: For the requested preset.}
        coverage: {type: number, minimum: 0, maximum: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        f: {$ref: "#/components/schemas/FactorValues"}
        s: {$ref: "#/components/schemas/FactorValues"}
        d: {type: array, maxItems: 3, items: {$ref: "#/components/schemas/AreaDriver"}}
        g: {type: array, maxItems: 2, items: {$ref: "#/components/schemas/AreaGap"}}
        source: {type: string}
        source_ref: {type: string, description: "`h3:<cell id>`."}
        fetched_at: {type: string, format: date}
        license: {type: string}
    AreaFeature:
      type: object
      required: [type, geometry, properties]
      additionalProperties: false
      properties:
        type: {type: string, const: Feature}
        geometry: {$ref: "#/components/schemas/PolygonGeometry"}
        properties: {$ref: "#/components/schemas/AreaProperties"}
    AreaCollection:
      type: object
      required: [type, features]
      additionalProperties: false
      properties:
        type: {type: string, const: FeatureCollection}
        features: {type: array, items: {$ref: "#/components/schemas/AreaFeature"}}

    # ---- assets ---------------------------------------------------------------------------------------
    PointGeometry:
      type: object
      required: [type, coordinates]
      additionalProperties: false
      properties:
        type: {type: string, const: Point}
        coordinates: {$ref: "#/components/schemas/Position"}
    LineGeometry:
      type: object
      required: [type, coordinates]
      additionalProperties: false
      properties:
        type: {type: string, enum: [LineString, MultiLineString]}
        coordinates:
          type: array
          description: Positions of a LineString, or a list of them for a MultiLineString.
    StationCollection:
      type: object
      required: [type, features]
      additionalProperties: false
      properties:
        type: {type: string, const: FeatureCollection}
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            additionalProperties: false
            properties:
              type: {type: string, const: Feature}
              geometry: {$ref: "#/components/schemas/PointGeometry"}
              properties:
                type: object
                required: [name, mode, source]
                additionalProperties: false
                properties:
                  name: {type: string}
                  mode: {type: string, enum: [metro, rail]}
                  source: {type: string}
    NamedPointCollection:
      type: object
      description: Points with a name - bus stops or toll plazas.
      required: [type, features]
      additionalProperties: false
      properties:
        type: {type: string, const: FeatureCollection}
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            additionalProperties: false
            properties:
              type: {type: string, const: Feature}
              geometry: {$ref: "#/components/schemas/PointGeometry"}
              properties:
                type: object
                required: [name]
                additionalProperties: false
                properties:
                  name: {type: string}
    HighwayCollection:
      type: object
      required: [type, features]
      additionalProperties: false
      properties:
        type: {type: string, const: FeatureCollection}
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            additionalProperties: false
            properties:
              type: {type: string, const: Feature}
              geometry: {$ref: "#/components/schemas/LineGeometry"}
              properties:
                type: object
                required: [ref, status, kind]
                additionalProperties: false
                properties:
                  ref: {type: string, description: Road reference such as NH 48.}
                  status: {type: string, enum: [operational, under_construction, proposed]}
                  kind: {type: string, enum: [nh_segment, expressway_segment]}
    BusSource:
      type: object
      required: [operator, tier, license, fetched_at]
      additionalProperties: false
      properties:
        operator: {type: string}
        tier: {type: string}
        license: {type: string}
        fetched_at: {type: string, format: date}
    AssetsResponse:
      type: object
      description: Only the layers asked for are present.
      additionalProperties: false
      properties:
        stations: {$ref: "#/components/schemas/StationCollection"}
        bus_stops:
          description: Null when the city has no bus feed.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/NamedPointCollection"
        bus_source:
          description: Provenance of the bus stops; present with `bus_stops`, null when there is no feed.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BusSource"
        highways: {$ref: "#/components/schemas/HighwayCollection"}
        toll_plazas: {$ref: "#/components/schemas/NamedPointCollection"}

    # ---- compare --------------------------------------------------------------------------------------
    FactorDelta:
      type: object
      description: A sub-score difference between the other city and the base city.
      required: [factor, delta, base, other]
      additionalProperties: false
      properties:
        factor: {$ref: "#/components/schemas/FactorId"}
        delta: {type: number, description: "other minus base, one decimal."}
        base: {type: number, minimum: 0, maximum: 100, description: The base city's sub-score.}
        other: {type: number, minimum: 0, maximum: 100, description: The other city's sub-score.}
    CompareRow:
      type: object
      required: [rank, id, name, state, tier, score, delta, better, worse]
      additionalProperties: false
      properties:
        rank: {type: integer, minimum: 1, description: Position in the compared set including the base city.}
        id: {type: string}
        name: {type: string}
        state: {type: string, pattern: "^[A-Z]{2}$"}
        tier: {$ref: "#/components/schemas/Tier"}
        score: {type: number, minimum: 0, maximum: 100}
        delta: {type: number, description: "This city's score minus the base city's, one decimal."}
        better: {type: array, maxItems: 2, items: {$ref: "#/components/schemas/FactorDelta"}, description: Where this city is stronger (delta above 0).}
        worse: {type: array, maxItems: 2, items: {$ref: "#/components/schemas/FactorDelta"}, description: Where this city is weaker (delta below 0).}
    CompareResponse:
      type: object
      required: [base, preset, scope, total, base_rank, others]
      additionalProperties: false
      properties:
        base: {$ref: "#/components/schemas/CityCard"}
        preset: {$ref: "#/components/schemas/PresetId"}
        scope: {type: string, enum: [metros, peers, state, india]}
        total: {type: integer, minimum: 0, description: "Other cities in scope, before `limit`."}
        base_rank: {type: integer, minimum: 1, description: The base city's rank in the compared set including itself (also `base.rank`).}
        others: {type: array, items: {$ref: "#/components/schemas/CompareRow"}}
