  /v1/cities:
    get:
      operationId: searchCities
      tags: [cities]
      summary: Find a city by name or alias
      description: |
        Case-insensitive match on city names and aliases (an alias is another big place inside the same urban
        centre, so "Thane" finds Mumbai); names that start with the text come before names that merely contain
        it. `matched` is the name or alias that matched. No match is a 200 with an empty list.
      parameters:
        - name: q
          in: query
          required: true
          description: Search text of 2-64 characters, in any script. Too short or too long is a 400. Never echoed back unescaped.
          schema: {type: string, minLength: 2, maxLength: 64}
          example: thane
        - name: limit
          in: query
          description: Maximum number of matches in the response. Outside 1-20 is a 400.
          schema: {type: integer, minimum: 1, maximum: 20, default: 8}
      responses:
        "200":
          description: Matching cities, best match first.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchResponse"}
              examples:
                alias:
                  summary: q=thane finds Mumbai through its alias
                  value:
                    cities:
                      - {id: mumbai, name: Mumbai, state: MH, tier: metro, population: 12600000, matched: Thane}
                nothing:
                  summary: q=zzz
                  value:
                    cities: []
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/cities/{id}:
