  /v1/cities/{id}/compare:
    get:
      operationId: compareCity
      tags: [cities]
      summary: The base city against other cities, with the reasons for each difference
      description: |
        `others` never contains the base city and is ordered by score, best first, so better and worse cities
        both appear. `delta` is the other city's score minus the base city's, as served. `better` and `worse`
        hold up to two sub-score differences each (largest first, ties by factor id): where the other city is
        stronger and where it is weaker - the reasons behind `delta`. `base_rank` is the base city's rank in
        the compared set including itself and `total` the number of other cities in scope, before `limit`.
        The default scope is `metros` when the base city is a metro and `peers` otherwise; a city with no
        peers gets `others: []` and `total: 0`.
      parameters:
        - $ref: "#/components/parameters/CityId"
        - $ref: "#/components/parameters/Preset"
        - name: scope
          in: query
          description: |
            Cities to compare against: `metros` the other metros, `peers` cities of the same tier across India,
            `state` the other cities of the base city's state, `india` every other city.
          schema: {type: string, enum: [metros, peers, state, india]}
        - name: limit
          in: query
          description: Maximum number of other cities in the response. Outside 1-10 is a 400.
          schema: {type: integer, minimum: 1, maximum: 10, default: 5}
      responses:
        "200":
          description: The comparison.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompareResponse"}
              examples:
                pune_commuter_metros:
                  summary: Pune, preset=commuter, default scope (metros)
                  value:
                    base:
                      rank: 3
                      id: pune
                      name: Pune
                      state: MH
                      tier: metro
                      population: 6100000
                      score: 63.5
                      access: 54.7
                      momentum: 90.0
                      coverage: 1.0
                      confidence: 0.8
                      drivers:
                        - {factor: built_up_growth, points: 22.5, value: 28.0, unit: pp, share: null, band_km: null}
                        - {factor: rail_access, points: 15.0, value: 3.6, unit: km, share: 0.0, band_km: 2}
                        - {factor: nh_access, points: 7.5, value: 4.3, unit: km, share: 1.0, band_km: 10}
                      gaps: []
                      best_area: {id: 876088500ffffff, name: Hinjewadi, score: 70.0}
                      source: synthetic-test
                      source_ref: city:pune
                      fetched_at: '2026-09-29'
                      license: synthetic-test
                    preset: commuter
                    scope: metros
                    total: 3
                    base_rank: 3
                    others:
                      - rank: 1
                        id: delhi
                        name: Delhi
                        state: DL
                        tier: metro
                        score: 73.8
                        delta: 10.3
                        better:
                          - {factor: metro_access, delta: 50.0, base: 40.0, other: 90.0}
                          - {factor: rail_access, delta: 20.0, base: 60.0, other: 80.0}
                        worse:
                          - {factor: built_up_growth, delta: -45.0, base: 90.0, other: 45.0}
                          - {factor: nh_access, delta: -5.0, base: 75.0, other: 70.0}
                      - rank: 2
                        id: mumbai
                        name: Mumbai
                        state: MH
                        tier: metro
                        score: 69.5
                        delta: 6.0
                        better:
                          - {factor: metro_access, delta: 40.0, base: 40.0, other: 80.0}
                          - {factor: rail_access, delta: 30.0, base: 60.0, other: 90.0}
                        worse:
                          - {factor: built_up_growth, delta: -50.0, base: 90.0, other: 40.0}
                          - {factor: nh_access, delta: -15.0, base: 75.0, other: 60.0}
                      - rank: 4
                        id: bengaluru
