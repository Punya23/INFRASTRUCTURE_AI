  /v1/cities/{id}/areas:
    get:
      operationId: listCityAreas
      tags: [cities]
      summary: The H3 cells of a city as GeoJSON, ranked for a preset
      description: |
        A FeatureCollection sorted by the preset's score (ties: larger population, then id). `rank` runs over
        all cells of the city, so it is stable under `limit`; a cell that is not `elig` still draws on the map
        but is never a best area. `source`, `fetched_at` and `license` are copied from the stored collection
        into every feature; `source_ref` is the cell's own (`h3:<id>`). `f` and `s` hold every factor, `null`
        where it was not observed - show "-", never 0.
      parameters:
        - $ref: "#/components/parameters/CityId"
        - $ref: "#/components/parameters/Preset"
        - name: limit
          in: query
          description: Maximum number of cells in the response. Outside 1-1000 is a 400.
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
      responses:
        "200":
          description: The cells, best first.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AreaCollection"}
