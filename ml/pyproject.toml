[project]
name = "infra-ai-ml"
version = "0.1.0"
description = "INFRA-AI data pipelines, analytics and AI services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "geopandas>=1.0",
    "h3>=4.1",
    "lxml>=5.2",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "pyarrow>=16",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "rasterio>=1.4",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
