# Every external source, declared once (skill add-data-source).
# Fetch: cd ml && uv run python -m common.fetch [source_id ...]
# `kind` is the expected file type; downloads whose first bytes don't match are rejected.

osm_india:
  url: https://download.geofabrik.de/asia/india-latest.osm.pbf
  dest: osm/india-latest.osm.pbf
  kind: pbf
  license: ODbL-1.0
  attribution: © OpenStreetMap contributors
  used_by: [national_highways, metro_rail, bus]

worldpop_india_2020_1km:
  url: https://data.worldpop.org/GIS/Population/Global_2000_2020_1km_UNadj/2020/IND/ind_ppp_2020_1km_Aggregated_UNadj.tif
  dest: worldpop/ind_ppp_2020_1km_Aggregated_UNadj.tif
  kind: tiff
  license: CC-BY-4.0
  attribution: WorldPop (www.worldpop.org) — India 2020, 1 km, UN-adjusted
  used_by: [shared]

datameet_states:
