# National Highways field parameters (docs/fields/national-highways.md). Every number states its basis.
h3_res_fixture: 4                    # ≈1,770 km² hexagons; res 5 (13k cells) measured 5.6 MB, over the 5 MB fixture cap — 2026-09-29
access_bands_km: [5, 10, 25]         # team judgment, 2026-09
access_target_km: 10                 # "within reach of an NH" for gain counts — team judgment, 2026-09
corridor_rings_km: {near: 2, far: [2, 10]}   # event-study rings — team judgment, 2026-09
corridor_open_years: [2001, 2019]    # opened between the two GHSL epochs (2000, 2020)
city_pairs:
  min_population: 300000             # GeoNames cities with ≥3 lakh people
  top_cities: 120                    # runtime cap for all-pairs Dijkstra
  min_km: 100                        # straight-line distance band for circuity
  max_km: 600
  snap_max_km: 25                    # cities farther than this from the NH graph are skipped
routing_road_classes: [primary, primary_link, secondary, secondary_link]  # context roads for city-pair routing
                                     #   only; NH-only routing broke where NHs cross cities on untagged roads — 2026-09-29
graph_snap_m: 50                     # dead end → nearest NH graph node: OSM ways that meet without a
                                     #   shared node (5,408 such ends in the 2026-09 extract) — team judgment
circuity_flag: 1.5                   # network km ÷ straight km above this = candidate missing link
toll_booth_snap_m: 50                # OSM toll booth → NH way; plaza nodes sit between carriageways — field plan
toll_cluster_m: 500                  # OSM booths closer than this form one plaza (a plaza spans both
                                     #   carriageways and many lanes) — team judgment, 2026-09-29
toll_name_match: 0.82                # name score (0.8 wrongly pairs Khalapur–Kelapur) (token containment or difflib ratio) for IHMCL ↔ OSM plaza names within a state — team judgment
crash_snap_m: 200                    # crash point → nearest NHAI segment for lane-band rates
fixture_simplify_deg: 0.005          # ≈500 m after merging way pieces; keeps the national segment fixture under 5 MB (measured 2026-09-29)

# NHAI toll fees: single-journey fee columns in nh_network_of_india_new, by vehicle class. The mapping is
# checked on every build: each class's median fee ÷ car fee must match the National Highways Fee
# (Determination of Rates and Collection) Rules, 2008 base-rate ratios within toll_ratio_tolerance.
toll_fee_columns: {car: toll_rate_, lcv: toll_rat_1, bus_truck: toll_rat_3, three_axle: toll_rat_5,
                   hcm_eme: toll_rat_7, oversized: toll_rat_9}
toll_fee_rule_ratios:              # Fee Rules 2008 base rates per km: 0.65, 1.05, 2.20, 2.40, 3.45, 4.20 (car = 1)
  {lcv: 1.615, bus_truck: 3.385, three_axle: 3.692, hcm_eme: 5.308, oversized: 6.462}
toll_ratio_tolerance: 0.10         # ±10% on the median ratio — team judgment, 2026-09-29
traffic_columns: [traffic_1, traffic_2, traffic_3, traffic_4, traffic_5, traffic_6, traffic_7, traffic_8,
                  traffic_9, traffic_10, traffic_11, traffic_12, traffic_13, traffic_14]
                                   # unlabelled NHAI counts: profiled only, never interpreted, until NHAI gives the legend

# Cited project events from MoRTH press releases on PIB (events.py; ADR-0008, ADR-0012). Rules, not a model:
# a release becomes an event only if its title matches a rule and one sentence of the opening paragraphs states
# the stage; the quote is copied verbatim and checked against the page. Everything else is listed in
# press_releases.csv with its reason — never dropped, never guessed.
events:
  evidence_max_chars: 500          # one sentence of a public press release (the longest of the 22 events is 482
                                   #   characters); ADR-0012 allows a short quote and PIB allows free reproduction
  opening_paragraphs: 4            # the stage sentence must sit in the first four paragraphs — PIB releases state the news first
  languages: [en]                  # Hindi and other-script releases are listed, not extracted, until a labelled gold set exists (docs/PLAN.md §14)
  max_listing_date_gap_days: 1     # MoRTH listing date vs the page's "Posted On" date
  confidence: {base: 0.75, nh_ref: 0.05, state: 0.05, cost: 0.05}  # official release + verified quote; +0.05 per anchor field found — team judgment, 2026-09-30
  review_below: 0.6                # docs/PLAN.md §8.4 step 11
  rules:                           # first title match wins; `evidence` picks the sentence that states the stage.
                                   #   The lifecycle enum (docs/PLAN.md §7) has no "awarded": a letter of award follows
                                   #   the tender, so bids received and contracts awarded both map to `tendered`
    - {type: cabinet_cost_revision, stage: approved, title: '^Cabinet approves Revised Cost', evidence: '\bapproved\b'}
    - {type: cabinet_approval, stage: approved, title: '^Cabinet approves', evidence: '\bapproved\b'}
    - {type: minister_approval, stage: approved, title: '\bapproves\s+(?:₹|Rs)', evidence: '\bapproved\b'}
    - {type: contract_awarded, stage: tendered, title: '\bAwards? Contract', evidence: 'Letter of Award|\bawarded\b'}
    - {type: bids_received, stage: tendered, title: '\bReceives? .*(?:Bidders|Bids)\b', evidence: '\bbid(?:s|ders)\b'}
    - {type: dpr_preparation, stage: proposed, title: '\bDPR Preparation\b', evidence: '\bDPR\b|Detailed Project Report'}
    - {type: foundation_stone, stage: under_construction, title: 'Foundation Stones?', evidence: 'foundation stone'}
    - {type: tunnel_breakthrough, stage: under_construction, title: 'Breakthrough .*Tunnel', evidence: 'breakthrough'}
    - {type: inaugurated, stage: operational, title: 'inaugurat|dedicat\w+ to (?:the )?nation|opens? to traffic', evidence: 'inaugurat|dedicat\w+|opened'}

# Project schedule and delay flags (schedule.py). Source: NHAI dashboard layer, ADR-0014 — aggregates only in git.
schedule:
  stage_groups:                    # NHAI `current_st` label -> group; a label not listed is "unknown", never guessed.
                                   #   PCC / CC = provisional / final completion certificate, AD = appointed date
                                   #   (NHAI EPC and HAM contract terms); 2026-09 extract has these nine labels
    not_awarded: ["Balance for Award"]
    awarded_not_started: ["Awarded, Not Appointed"]
    under_construction: ["Under Construction (AD issued)"]
    provisionally_complete: ["PCC Issued, CC Pending"]
    completed: ["CC Issued & O&M by Construction Agency", "Under O&M through OMT/TOT/O&M Agency at Site",
                "Completed & Agency Demobilised (Civil/O&M)", "O&M on Project no more required"]
    terminated: ["Terminated"]
  in_execution: [awarded_not_started, under_construction]  # delay flags apply only here. PCC-issued projects are left
                                   #   out: the layer has no PCC date, so a passed scheduled date does not show lateness
  date_year_range: [2000, 2040]    # the 2026-09 extract holds a 1999 and a 2051 scheduled date — read as data errors
